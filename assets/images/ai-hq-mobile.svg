<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="360" height="690" fill="#ffffff"/>
  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4532a"/>
    </marker>
  </defs>

  <text x="195" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2b2420">My AI headquarters</text>

  <!-- Phone -->
  <rect x="60" y="62" width="270" height="110" rx="14" fill="#ffffff" stroke="#e8ded3" stroke-width="2"/>
  <text x="195" y="100" text-anchor="middle" font-size="28">📱</text>
  <text x="195" y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2420">Me</text>
  <text x="195" y="155" text-anchor="middle" font-size="16" fill="#6b5e55">ask · review · merge</text>

  <path d="M195 172 L195 210" stroke="#b4532a" stroke-width="2" fill="none" marker-end="url(#arrow-m)"/>
  <text x="208" y="197" font-size="15" fill="#6b5e55">a task</text>

  <!-- AI agent -->
  <rect x="60" y="216" width="270" height="104" rx="14" fill="#ffffff" stroke="#e8ded3" stroke-width="2"/>
  <text x="195" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2420">AI assistant</text>
  <text x="195" y="276" text-anchor="middle" font-size="16" fill="#6b5e55">plans, builds,</text>
  <text x="195" y="298" text-anchor="middle" font-size="16" fill="#6b5e55">tests its own work</text>

  <path d="M195 320 L195 354" stroke="#b4532a" stroke-width="2" fill="none" marker-end="url(#arrow-m)"/>

  <!-- Guard -->
  <rect x="60" y="360" width="270" height="100" rx="14" fill="#f8ece4" stroke="#b4532a" stroke-width="2"/>
  <text x="195" y="393" text-anchor="middle" font-size="19" font-weight="700" fill="#b4532a">🛡️ Guardrails</text>
  <text x="195" y="419" text-anchor="middle" font-size="16" fill="#b4532a">written rules +</text>
  <text x="195" y="441" text-anchor="middle" font-size="16" fill="#b4532a">a hook that blocks</text>

  <path d="M195 460 L195 498" stroke="#b4532a" stroke-width="2" fill="none" marker-end="url(#arrow-m)"/>
  <text x="208" y="485" font-size="15" fill="#6b5e55">pull request</text>

  <!-- Repo -->
  <rect x="60" y="504" width="270" height="110" rx="14" fill="#ffffff" stroke="#e8ded3" stroke-width="2"/>
  <text x="195" y="542" text-anchor="middle" font-size="28">🗂️</text>
  <text x="195" y="572" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2420">HQ repo</text>
  <text x="195" y="597" text-anchor="middle" font-size="16" fill="#6b5e55">rules · notes · plans</text>

  <!-- Back to me: dashed loop on the left -->
  <path d="M195 614 L195 640 L28 640 L28 117 L56 117" stroke="#6b5e55" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-m)"/>
  <text x="195" y="670" text-anchor="middle" font-size="16" fill="#6b5e55">nothing lands until I merge it</text>
</svg>
