<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">
  <title id="t">Why you need GitHub</title>
  <desc id="d">Today's session runs on a temporary computer that is deleted after the session goes quiet. Before that, Claude pushes the work to GitHub, which keeps it. Tomorrow's session gets a new temporary computer and copies the repository from GitHub.</desc>
  <!-- Colours: dashed muted = temporary; solid accent = GitHub, the thing that lasts; ink = arrows and names.
       Contrast, light on #ffffff/#faf6f0: ink 15.3/14.2:1, muted 6.3/5.8:1, accent 5.0/4.6:1. Dark on #262019/#2a231e: ink 13.2/12.6:1, muted 7.1/6.9:1, accent 6.5/6.2:1. -->
  <style>
    .bg { fill: #faf6f0; } .box { fill: #ffffff; } .ink { fill: #2b2420; } .mut { fill: #6b5e55; } .acc { fill: #b4532a; }
    .s-ink { stroke: #2b2420; } .s-mut { stroke: #6b5e55; } .s-acc { stroke: #b4532a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2a231e; } .box { fill: #262019; } .ink { fill: #efe7df; } .mut { fill: #b9aa9d; } .acc { fill: #e3906a; }
      .s-ink { stroke: #efe7df; } .s-mut { stroke: #b9aa9d; } .s-acc { stroke: #e3906a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="400" height="430" rx="16"/>

  <!-- Session 1: dashed because it is temporary -->
  <rect class="box s-mut" x="24" y="22" width="352" height="92" rx="12" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="ink" x="44" y="54" font-size="18" font-weight="700">Today’s session computer</text>
  <text class="mut" x="44" y="80">temporary: deleted when the</text>
  <text class="mut" x="44" y="101">session goes quiet</text>

  <!-- push arrow -->
  <line class="s-ink" x1="200" y1="116" x2="200" y2="160" stroke-width="2.5"/>
  <path class="ink" d="M191 154 L200 170 L209 154 Z"/>
  <text x="216" y="146"><tspan class="ink" font-weight="700">push</tspan><tspan class="mut"> (save to GitHub)</tspan></text>

  <!-- GitHub: solid accent, because it is the thing that lasts -->
  <rect class="box s-acc" x="24" y="174" width="352" height="96" rx="12" stroke-width="3"/>
  <text class="acc" x="44" y="208" font-size="20" font-weight="700">GitHub, in the cloud</text>
  <text class="ink" x="44" y="235">keeps your repository and</text>
  <text class="ink" x="44" y="256">every saved change, for good</text>

  <!-- clone arrow -->
  <line class="s-ink" x1="200" y1="272" x2="200" y2="316" stroke-width="2.5"/>
  <path class="ink" d="M191 310 L200 326 L209 310 Z"/>
  <text x="216" y="302"><tspan class="ink" font-weight="700">clone</tspan><tspan class="mut"> (copy it in)</tspan></text>

  <!-- Session 2 -->
  <rect class="box s-mut" x="24" y="330" width="352" height="78" rx="12" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="ink" x="44" y="362" font-size="18" font-weight="700">Tomorrow’s session computer</text>
  <text class="mut" x="44" y="388">a new one, starts from GitHub</text>
</svg>
